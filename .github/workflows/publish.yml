name: Python package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Python distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.7'
          python-version: '3.12.14'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: uv run --no-project --with packaging==26.3 python scripts/checks/check-release-version.py
      - name: Check documentation
        run: python3 scripts/checks/check-docs.py --root .
      - name: Build wheel and source distribution without workspace sources
        run: uv build --no-sources --out-dir dist/python
      - name: Check package metadata and README
        run: uvx --from twine==7.0.0 twine check --strict dist/python/*
      - name: Rebuild wheel from the source distribution
        run: |
          mkdir "$RUNNER_TEMP/carrier-sdist"
          tar -xzf dist/python/*.tar.gz -C "$RUNNER_TEMP/carrier-sdist" --strip-components=1
          uv build --no-sources --wheel "$RUNNER_TEMP/carrier-sdist" --out-dir "$RUNNER_TEMP/rebuilt-wheel"
      - name: Install and test using public dependencies
        run: |
          uv venv "$RUNNER_TEMP/carrier-smoke"
          uv pip install --python "$RUNNER_TEMP/carrier-smoke/bin/python" --index-url https://pypi.org/simple dist/python/*.whl pytest==8.4.2
          "$RUNNER_TEMP/carrier-smoke/bin/python" -I scripts/verify_product.py
          "$RUNNER_TEMP/carrier-smoke/bin/python" -m pytest -q tests/test_carrier.py tests/test_sdk.py
          uv pip install --python "$RUNNER_TEMP/carrier-smoke/bin/python" --reinstall --no-deps "$RUNNER_TEMP/rebuilt-wheel/"*.whl
          "$RUNNER_TEMP/carrier-smoke/bin/python" -I scripts/verify_product.py
      - name: Save checked distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/python/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/aixand-carrier-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
