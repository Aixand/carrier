name: Carrier product installer
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15, windows-2022]
    defaults:
      run:
        working-directory: carrier
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          path: carrier
          persist-credentials: false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          repository: ${{ vars.AIXAND_LIBRARIES_REPOSITORY || 'Aixand/aixand-libraries' }}
          ref: ${{ vars.AIXAND_LIBRARIES_REF || 'main' }}
          path: aixand-libraries
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.7'
          python-version: '3.12.14'
      - run: uv python install 3.12.14
      - name: Add managed Python to PATH
        shell: bash
        run: |
          managed_python=$(uv python find 3.12.14)
          dirname "$managed_python" >> "$GITHUB_PATH"
      - name: Native Windows command launcher toolchain
        if: runner.os == 'Windows'
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Static OpenSSL for Intel macOS cryptography
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
      - run: python scripts/carrier_dev.py develop
      - run: python scripts/carrier_dev.py check
      - run: python scripts/carrier_dev.py test
      - run: python scripts/carrier_dev.py package --output dist/release
      - run: python scripts/carrier_dev.py verify --artifact dist/release --install --report dist/verification.json
      - run: python scripts/prepare_runtime.py --bootstrap-output dist/bootstrap
      - name: Offline lifecycle, next-version upgrade, and Python-free bootstrap
        run: python scripts/qualify_installation.py dist/release --build-upgrade --bootstrap dist/bootstrap --report dist/lifecycle.json
      - run: python scripts/carrier_dev.py export-release --artifact dist/release --report dist/verification.json --output dist/handoff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carrier-${{ runner.os }}-${{ runner.arch }}
          path: |
            carrier/dist/handoff/
            carrier/dist/bootstrap/
            carrier/dist/lifecycle.json
          if-no-files-found: error
